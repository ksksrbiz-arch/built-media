[build]
  base = "."
  command = "npm install && npm run build"
  publish = "web/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["stripe", "@supabase/supabase-js"]

[dev]
  command = "npm run dev --workspace=web"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# Hashed asset filenames (e.g. index-DCbkw0Jk.js) are content-addressed —
# any code change produces a new hash. Safe to cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must always revalidate so users get the latest bundle references
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# All /api/* routes are owned by Netlify Functions which self-register
# their paths via `export const config: Config = { path: '...' }`.
# Only the SPA fallback below remains so React Router handles client-side
# routing for non-API paths.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
