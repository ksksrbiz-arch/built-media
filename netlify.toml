[build]
  base = "."
  command = "npm run build"
  publish = "web/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["stripe", "@supabase/supabase-js"]

[dev]
  command = "npm run dev --workspace=web"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# API routes
[[redirects]]
  from = "/api/clips"
  to = "/.netlify/functions/clip-list"
  status = 200
  conditions = {Method = ["GET"]}

[[redirects]]
  from = "/api/clips"
  to = "/.netlify/functions/clip-create"
  status = 200
  conditions = {Method = ["POST"]}

[[redirects]]
  from = "/api/clips/:id"
  to = "/.netlify/functions/clip-get?id=:id"
  status = 200

[[redirects]]
  from = "/api/me"
  to = "/.netlify/functions/me"
  status = 200

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout-session"
  status = 200

[[redirects]]
  from = "/api/webhooks/stripe"
  to = "/.netlify/functions/webhook-stripe"
  status = 200

[[redirects]]
  from = "/api/webhooks/opus"
  to = "/.netlify/functions/webhook-opus"
  status = 200

# SPA fallback (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
